<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiberoFlow - Habit Tracker</title>
    <!-- Tailwind CSS CDN per un design moderno e pulito -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="card-glass border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">LiberoFlow</h1>
                <p class="text-xs text-slate-400">Traccia le tue abitudini quotidiane</p>
            </div>
        </div>
        <div id="current-date" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-indigo-400 border border-slate-700"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-6 space-y-6">
        
        <!-- Statistiche rapide -->
        <div class="grid grid-cols-2 gap-4">
            <div class="card-glass p-4 rounded-2xl border border-slate-800">
                <div class="text-slate-400 text-xs font-medium uppercase tracking-wider">Completate Oggi</div>
                <div id="completed-count" class="text-3xl font-extrabold text-white mt-1">0 / 0</div>
            </div>
            <div class="card-glass p-4 rounded-2xl border border-slate-800">
                <div class="text-slate-400 text-xs font-medium uppercase tracking-wider">Streak Globale</div>
                <div id="streak-count" class="text-3xl font-extrabold text-indigo-400 mt-1">🔥 0 giorni</div>
            </div>
        </div>

        <!-- Sezione Aggiungi Abitudine -->
        <div class="card-glass p-5 rounded-2xl border border-slate-800 shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-3"><i class="fa-solid fa-plus-circle mr-2 text-indigo-500"></i>Nuova Abitudine</h2>
            <form id="habit-form" class="flex gap-3">
                <input type="text" id="habit-input" placeholder="Es. Studiare medicina, Allenamento..." required
                    class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30 transition">
                    Aggiungi
                </button>
            </form>
        </div>

        <!-- Lista Abitudini -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 px-1">Le tue abitudini</h2>
            <div id="habits-list" class="space-y-3">
                <!-- Verranno inserite dinamicamente -->
            </div>
        </div>

    </main>

    <!-- Script di gestione -->
    <script>
        // Gestione data odierna
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('it-IT', options);

        // Caricamento dati da localStorage
        let habits = JSON.parse(localStorage.getItem('liberoflow_habits')) || [
            { id: 1, name: 'Studio Semestre Filtro (Biologia/Chimica)', completed: false },
            { id: 2, name: 'Sessione di programmazione', completed: false }
        ];

        function saveData() {
            localStorage.setItem('liberoflow_habits', JSON.stringify(habits));
            renderHabits();
        }

        function toggleHabit(id) {
            habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
            saveData();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveData();
        }

        function renderHabits() {
            const listEl = document.getElementById('habits-list');
            listEl.innerHTML = '';
            
            if (habits.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">Nessuna abitudine inserita. Aggiungine una qui sopra!</div>`;
                document.getElementById('completed-count').innerText = `0 / 0`;
                return;
            }

            let completed = 0;
            habits.forEach(habit => {
                if (habit.completed) completed++;
                const div = document.createElement('div');
                div.className = `card-glass p-4 rounded-2xl flex items-center justify-between border transition ${habit.completed ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-slate-800'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-4 cursor-pointer flex-1" onclick="toggleHabit(${habit.id})">
                        <div class="w-7 h-7 rounded-lg border-2 flex items-center justify-center transition ${habit.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600 bg-slate-900'}">
                            ${habit.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm font-medium ${habit.completed ? 'line-through text-slate-400' : 'text-white'}">${habit.name}</span>
                    </div>
                    <button onclick="deleteHabit(${habit.id})" class="text-slate-500 hover:text-red-400 p-2 transition">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                listEl.appendChild(div);
            });

            document.getElementById('completed-count').innerText = `${completed} / ${habits.length}`;
        }

        document.getElementById('habit-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('habit-input');
            if (input.value.trim() === '') return;
            
            habits.push({
                id: Date.now(),
                name: input.value.trim(),
                completed: false
            });
            
            input.value = '';
            saveData();
        });

        // Primo rendering
        renderHabits();
    </script>
</body>
</html>
